<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study-HTML+CSS+JS</title>

    <link rel="stylesheet" href="box.css">
</head>
<body>

    <main class="list">
        <div class="list-name">
            <h2>페이지 소개</h2>
        </div>

        <article class="list-detail">
            <p>안녕하세요. 오즈 코딩 스쿨 12기 초격차 프론트엔드 과정에 참여한 장병권 입니다.<br><br>
                이 페이지는 프론트엔드 학습의 기초가 되는 HTML, CSS, JavaScript 과제를 정리하고 기록하기 위해 제작했습니다. 학습한 내용을 단순히 정리하는 데서 그치지 않고, 실제 웹페이지를 구현해보며 구조화된 UI와 간단한 기능 구현을 통해 이해도를 높이고자 했습니다. 
                <br><br>
                또한 깃허브 페이지(GitHub Pages) 스터디에 참여하며, 협업을 통해 깃허브 페이지를 직접 배포해보는 경험도 함께 했습니다. 
            </p>
        </article>

    </main>
    
    <aside class="dash-board">
            <h3 id="dash-board-title">대시보드</h3>
            
            <button class="dash-board-btn">about</button>
            <button class="dash-board-btn">html+css</button>

    </aside>
